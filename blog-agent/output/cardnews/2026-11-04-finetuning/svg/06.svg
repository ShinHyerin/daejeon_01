</defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F5F1E8" stroke="none" stroke-width="1" /><rect x="0" y="0" width="1080" height="1350" rx="0" fill="url(#dots)" stroke="none" stroke-width="1" /><image x="82" y="74" width="132" height="35" xlink:href="data:image/png;base64,"/><text x="1008" y="98" font-size="22" fill="#706A61" font-weight="700" text-anchor="end" >AI INSIGHT  /  02</text><path d="M72 1238 H1008" stroke="#D9CEC0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="72" y="1285" font-size="19" fill="#706A61" font-weight="400" text-anchor="start" >URACLE  /  FINE-TUNING</text><text x="1008" y="1285" font-size="23" fill="#C74D2F" font-weight="700" text-anchor="end" >06 / 08</text><circle cx="104" cy="190" r="32" fill="url(#badge)" stroke="none" stroke-width="1"/><text x="104" y="201" font-size="30" fill="white" font-weight="700" text-anchor="middle" >5</text><text x="159" y="199" font-size="23" fill="#706A61" font-weight="700" text-anchor="start" >선택 기준</text><text x="72" y="313" font-size="66" fill="#25231F" font-weight="700" text-anchor="start" >추가 학습과 검색,</text><text x="72" y="401" font-size="66" fill="#25231F" font-weight="700" text-anchor="start" >바꾸는 대상이 다릅니다</text><rect x="72" y="473" width="456" height="134" rx="20" fill="#25231F" stroke="none" stroke-width="1" /><text x="100" y="530" font-size="36" fill="#FAF5EB" font-weight="700" text-anchor="start" >파인튜닝</text><text x="100" y="575" font-size="25" fill="#D7C5B2" font-weight="400" text-anchor="start" >학습으로 모델 조정</text><rect x="552" y="473" width="456" height="134" rx="20" fill="#F0DED0" stroke="none" stroke-width="1" /><text x="580" y="530" font-size="36" fill="#25231F" font-weight="700" text-anchor="start" >RAG</text><text x="580" y="575" font-size="25" fill="#706A61" font-weight="400" text-anchor="start" >검색한 정보를 입력에 추가</text><text x="77" y="648" font-size="23" fill="#C74D2F" font-weight="700" text-anchor="start" >조정 방식</text><path d="M72 767 H1008" stroke="#D9CEC0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="697" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >업무 예시를 추가 학습해</text><text x="100" y="740" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >모델의 가중치를 조정</text><text x="580" y="697" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >관련 정보를 검색해</text><text x="580" y="740" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >질문과 함께 모델에 제공</text><text x="77" y="802" font-size="23" fill="#C74D2F" font-weight="700" text-anchor="start" >주로 검토할 목적</text><path d="M72 921 H1008" stroke="#D9CEC0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="851" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >일관된 문체·형식,</text><text x="100" y="894" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >특정 작업 수행 개선</text><text x="580" y="851" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >사내 문서나 바뀌는 자료를</text><text x="580" y="894" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >근거로 한 응답</text><text x="77" y="956" font-size="23" fill="#C74D2F" font-weight="700" text-anchor="start" >점검할 요소</text><path d="M72 1075 H1008" stroke="#D9CEC0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="1005" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >학습 데이터 품질,</text><text x="100" y="1048" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >자원과 학습 후 평가</text><text x="580" y="1005" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >자료·검색 품질,</text><text x="580" y="1048" font-size="27" fill="#25231F" font-weight="400" text-anchor="start" >접근 권한과 답변 평가</text><rect x="72" y="1135" width="936" height="72" rx="18" fill="#EAD4C2" stroke="none" stroke-width="1" /><text x="540" y="1181" font-size="27" fill="#25231F" font-weight="700" text-anchor="middle" >목적에 따라 두 접근법을 함께 사용할 수도 있습니다</text></svg>