<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350"><style>text{font-family:"Malgun Gothic",sans-serif;letter-spacing:-1px}</style><defs>
