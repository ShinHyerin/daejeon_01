</defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F5F1E8" stroke="none" stroke-width="1" /><rect x="0" y="0" width="1080" height="1350" rx="0" fill="url(#dots)" stroke="none" stroke-width="1" /><image x="82" y="74" width="132" height="35" xlink:href="data:image/png;base64,"/><text x="1008" y="98" font-size="22" fill="#706A61" font-weight="700" text-anchor="end" >AI INSIGHT  /  02</text><path d="M72 1238 H1008" stroke="#D9CEC0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="72" y="1285" font-size="19" fill="#706A61" font-weight="400" text-anchor="start" >URACLE  /  FINE-TUNING</text><text x="1008" y="1285" font-size="23" fill="#C74D2F" font-weight="700" text-anchor="end" >02 / 08</text><circle cx="104" cy="190" r="32" fill="url(#badge)" stroke="none" stroke-width="1"/><text x="104" y="201" font-size="30" fill="white" font-weight="700" text-anchor="middle" >1</text><text x="159" y="199" font-size="23" fill="#706A61" font-weight="700" text-anchor="start" >파인튜닝의 개념</text><text x="72" y="313" font-size="66" fill="#25231F" font-weight="700" text-anchor="start" >기존 모델을</text><text x="72" y="401" font-size="66" fill="#25231F" font-weight="700" text-anchor="start" >업무 예시로 추가 학습</text><text x="76" y="465" font-size="29" fill="#706A61" font-weight="400" text-anchor="start" >특정 작업이나 분야의 데이터를 학습해</text><text x="76" y="509" font-size="29" fill="#706A61" font-weight="400" text-anchor="start" >모델의 가중치, 즉 매개변수를 조정합니다</text><rect x="72" y="594" width="936" height="485" rx="22" fill="#FCFAF5" stroke="#D9CEC0" stroke-width="1" /><rect x="72" y="594" width="936" height="485" rx="22" fill="url(#grid)" stroke="none" stroke-width="1" /><rect x="116" y="630" width="322" height="188" rx="20" fill="white" stroke="#D9CEC0" stroke-width="1" filter="url(#shadow)"/><g transform="translate(246 649) scale(0.96875)"><rect x="15" y="15" width="34" height="34" rx="5" fill="none" stroke="#C74D2F" stroke-width="3" /><path d="M22 4 V15 M22 49 V60 M4 22 H15 M49 22 H60" stroke="#C74D2F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M32 4 V15 M32 49 V60 M4 32 H15 M49 32 H60" stroke="#C74D2F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 4 V15 M42 49 V60 M4 42 H15 M49 42 H60" stroke="#C74D2F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="277" y="756" font-size="31" fill="#25231F" font-weight="700" text-anchor="middle" >사전 학습 모델</text><text x="277" y="795" font-size="23" fill="#706A61" font-weight="400" text-anchor="middle" >기본 언어 능력</text><rect x="642" y="630" width="322" height="188" rx="20" fill="white" stroke="#D9CEC0" stroke-width="1" filter="url(#shadow)"/><g transform="translate(772 649) scale(0.96875)"><path d="M15 5 H39 L53 19 V59 H15 Z M39 5 V19 H53 M24 30 H44 M24 39 H44 M24 48 H38" stroke="#C74D2F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="803" y="756" font-size="31" fill="#25231F" font-weight="700" text-anchor="middle" >업무 학습 데이터</text><text x="803" y="795" font-size="23" fill="#706A61" font-weight="400" text-anchor="middle" >질문·응답, 대화 등</text><text x="540" y="743" font-size="56" fill="#C74D2F" font-weight="400" text-anchor="middle" >+</text><path d="M277 822 V855 H540 M803 822 V855 H540" stroke="#C74D2F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M540 855 L540 887" stroke="#C74D2F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M533.7889327926546 877.9213082359936 L540 887 L546.2110672073454 877.9213082359936" stroke="#C74D2F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="251" y="900" width="578" height="127" rx="22" fill="url(#warm)" stroke="#D8AB8D" stroke-width="1" /><text x="540" y="952" font-size="37" fill="#25231F" font-weight="700" text-anchor="middle" >추가 학습한 모델</text><text x="540" y="996" font-size="27" fill="#C74D2F" font-weight="700" text-anchor="middle" >목표 작업에 맞게 조정</text><text x="1008" y="1114" font-size="19" fill="#706A61" font-weight="400" text-anchor="end" >원문 그림 1의 핵심 흐름을 재구성</text><text x="76" y="1170" font-size="29" fill="#25231F" font-weight="700" text-anchor="start" >학습 후에는 목표 업무에서 결과를 평가합니다</text></svg>